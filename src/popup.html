<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extName">Tab Group Manager</title>
    <link rel="icon" type="image/png" href="../icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="extName">Tab Group Manager</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled" />
        <span data-i18n="popupEnable">Enabled</span>
      </label>
    </header>

    <dl class="stats">
      <div>
        <dt data-i18n="popupGroupCount">Groups</dt>
        <dd id="groupCount">–</dd>
      </div>
      <div>
        <dt data-i18n="popupActiveGroup">Current group</dt>
        <dd id="activeGroup">–</dd>
      </div>
    </dl>

    <div class="actions">
      <button type="button" id="normalizeButton" data-i18n="popupNormalize">Tidy up now</button>
      <button type="button" id="optionsButton" class="secondary" data-i18n="popupSettings">Settings</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
