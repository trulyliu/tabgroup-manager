name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=tabgroup-manager-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Package
        run: |
          set -euo pipefail
          zip="${{ steps.version.outputs.zip }}"
          zip -r "$zip" manifest.json src _locales icons README.md README.en.md CHANGELOG.md
          sha256sum "$zip" > "$zip.sha256"
          unzip -l "$zip"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="${{ steps.version.outputs.zip }}"
          assets=("$zip" "$zip.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Tab Group Manager $TAG" \
              --generate-notes
          fi
